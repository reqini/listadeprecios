name: Mantener despierto el bot de WhatsApp

# El plan free de Render duerme el servicio a los ~15 min sin tráfico. Este job le
# pega al endpoint /health cada 5 minutos para mantenerlo despierto y que el bot no
# pierda mensajes. Es best-effort: GitHub puede demorar los cron programados en horas
# pico, así que si necesitás garantía dura, conviene el plan pago de Render o un
# pinger externo dedicado (cron-job.org). El repo es público → Actions sin costo.

on:
  schedule:
    - cron: '*/5 * * * *' # cada 5 minutos (mínimo permitido por GitHub)
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pegarle a /health
        run: |
          echo "Pinging el bot para mantenerlo despierto…"
          # --max-time alto para tolerar el cold start (~50s) sin marcar el job en rojo
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 \
            https://whatsapp-bot-listadeprecios.onrender.com/health \
            && echo " → OK, servicio despierto" \
            || echo " → no respondió a tiempo (probable cold start); el ping igual lo despierta"
